# CI/CD for gogdl-lib. Runs on the self-hosted runner on thinkcentre.home (Docker executor), same
# setup as gogdl_flutter's and lumen's .gitlab-ci.yml. See v1.1.0-FOUNDATION.md (Phases 5 and 6):
# the `check` stage gates everything, and the `release` stage publishes a GitLab release on
# vX.Y.Z tags.
# This crate has no private dependencies, so the check and release jobs need no deploy key; only
# the manual `downstream` job does (see it below).
#
# Jobs run in a prebuilt image (ci/Dockerfile: apt packages and the pinned rustup toolchain),
# so none of them touches apt or rustup: the network is slow and the runner is small. The
# runner shares the host's docker through its mounted docker.sock, so the image is built on the
# host with `ci/build-image.sh` and jobs see it directly. Rebuild it after bumping the channel
# in rust-toolchain.toml (update `image:` below to the printed name; the `.toolchain` check
# fails a job whose image has a stale Rust). The runner's config.toml (volume
# `gitlab-runner-config`) must not force pulls, under [runners.docker]:
#   pull_policy = ["if-not-present"]
# (or allowed_pull_policies including it), then `docker service update --force gitlab-runner`.
#
# If a job fails to resolve thinkcentre.home, the runner's containers aren't seeing the LAN's
# /etc/hosts entry (it's a hosts-file entry, not real DNS). Fix it in
# /etc/gitlab-runner/config.toml under [runners.docker]:
#   extra_hosts = ["thinkcentre.home:192.168.8.234"]
# then restart the runner (`sudo gitlab-runner restart`).

# Pipelines run only for tag pushes (e.g. v1.1.0) and for manual runs from the web UI
# (Build -> Pipelines -> Run pipeline) on any branch, to keep load off the self-hosted runner.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - check
  - release
  - downstream

default:
  image:
    name: gogdl-lib-ci:rust-1.98.1
    pull_policy: if-not-present

# Everything that gets cached must live inside the project dir. The toolchain is in the image
# (/opt/cargo/bin is on PATH); only cargo's download caches are relocated here.
variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.ci/cargo"
  CARGO_TERM_COLOR: always

# Fails when the image's Rust isn't the one pinned in rust-toolchain.toml, which would
# otherwise be tested against the old toolchain without any error (rustup would even download
# the pinned one on every run). (A literal block, not a plain list-item string: the sed
# script's `" *"` would otherwise be fragile in YAML.)
.toolchain:
  script:
    - |
      want=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)
      have=$(cat /opt/rust-version)
      if [ "$want" != "$have" ]; then
        echo "CI image has Rust $have but rust-toolchain.toml pins $want: rebuild it with ci/build-image.sh and update image: in .gitlab-ci.yml" >&2
        exit 1
      fi
    - rustc --version

.cache-cargo: &cache-cargo
  key:
    prefix: cargo
    files:
      - Cargo.lock
  paths:
    - .ci/cargo/registry/
    - .ci/cargo/git/

.cache-target: &cache-target
  key:
    prefix: target-$CI_JOB_NAME
    files:
      - Cargo.lock
  paths:
    - target/

lint:
  stage: check
  cache:
    - *cache-cargo
    - *cache-target
  before_script:
    - !reference [.toolchain, script]
  script:
    - cargo fmt --check
    - cargo clippy --locked --all-targets -- -D warnings

# Unit tests, tests/ and doctests, all offline (the HTTP fixture binds 127.0.0.1).
test:
  stage: check
  cache:
    - *cache-cargo
    - *cache-target
  before_script:
    - !reference [.toolchain, script]
  script:
    - cargo test --locked

# Keeps missing_docs and intra-doc links honest.
doc:
  stage: check
  variables:
    RUSTDOCFLAGS: "-D warnings"
  cache:
    - *cache-cargo
    - *cache-target
  before_script:
    - !reference [.toolchain, script]
  script:
    - cargo doc --no-deps --locked

# Runs after all check jobs, on vX.Y.Z tags only. tool/release_notes.sh fails if Cargo.toml,
# Cargo.lock and the tag disagree, or if CHANGELOG.md has no section for the version, so a tag
# can't ship without matching versions and notes. The release uses CI_JOB_TOKEN.
release:
  stage: release
  image:
    name: registry.gitlab.com/gitlab-org/release-cli:latest
    pull_policy: if-not-present
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  cache: []
  script:
    # glab, which creates the release, talks to https://thinkcentre.home, signed by a private CA
    # the image doesn't trust. The runner hands that CA to jobs as CI_SERVER_TLS_CA_FILE when
    # its config.toml has tls-ca-file, so add it to the trust store (Go reads this bundle).
    - |
      if [ -n "${CI_SERVER_TLS_CA_FILE:-}" ]; then
        cat "$CI_SERVER_TLS_CA_FILE" >> /etc/ssl/certs/ca-certificates.crt
      else
        echo "warning: CI_SERVER_TLS_CA_FILE is not set; creating the release will fail on the private CA unless the runner provides it" >&2
      fi
    - sh tool/release_notes.sh "$CI_COMMIT_TAG" > release_notes.md
    - cat release_notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./release_notes.md

# Manual only, and never part of a tag pipeline's outcome: builds the two consumers against this
# commit, so a breaking change shows up before the tag instead of when a consumer bumps its pin
# (GAPS "No downstream build check"). Start it from Build -> Pipelines -> Run pipeline, then play
# the job. It clones each consumer, appends a [patch] that points gogdl-lib at this checkout, and
# runs `cargo build` for lumen-cli and `cargo test` for the bridge's rust/ crate (no Flutter, no
# codegen: rust/ has no build.rs).
#
# Refs: LUMEN_CLI_REF and BRIDGE_REF default to main, and can be overridden in the Run pipeline
# form. lumen-cli's main still pins gogdl-lib v1.0.4, so until its feature/remote-config is
# merged, set LUMEN_CLI_REF=feature/remote-config or the job fails on its own old code.
#
# Access: one read-only deploy key, enabled on the lumen-cli, gogdl_flutter and gogdl-lib
# projects (Settings -> Repository -> Deploy keys), stored base64-encoded on one line as
# `DOWNSTREAM_DEPLOY_KEY_B64` (Settings -> CI/CD -> Variables: Type Variable, masked, NOT
# protected: a protected variable comes through empty on unprotected branches). One key rather
# than one per project because ssh offers the agent's first key and doesn't fall back to the next
# once GitLab rejects it for the other project.
#
# Toolchain: this image's Rust (RUSTUP_TOOLCHAIN) is used for both consumers, whatever their own
# rust-toolchain.toml says. No --locked: `cargo update -p gogdl-lib` rewrites gogdl-lib's entry in
# their Cargo.lock so the [patch] takes effect (in the checkouts only, nothing is pushed).
downstream:
  stage: downstream
  rules:
    - when: manual
  allow_failure: true
  variables:
    LUMEN_CLI_REF: main
    BRIDGE_REF: main
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    CARGO_TARGET_DIR: "$CI_PROJECT_DIR/.ci/downstream/target"
  cache:
    - *cache-cargo
    - key:
        prefix: target-downstream
        files:
          - Cargo.lock
      paths:
        - .ci/downstream/target/
  before_script:
    - !reference [.toolchain, script]
    - mkdir -p ~/.ssh
    - echo "$DOWNSTREAM_DEPLOY_KEY_B64" | base64 -d > ~/.ssh/downstream_deploy_key
    - chmod 600 ~/.ssh/downstream_deploy_key
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/downstream_deploy_key
    - ssh-keyscan -p 2200 thinkcentre.home >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - export RUSTUP_TOOLCHAIN=$(cat /opt/rust-version)
    - rm -rf .ci/downstream/lumen-cli .ci/downstream/gogdl_flutter
    - mkdir -p .ci/downstream
    - git clone --depth 1 --branch "$LUMEN_CLI_REF" ssh://git@thinkcentre.home:2200/gogdl/lumen-cli.git .ci/downstream/lumen-cli
    - git clone --depth 1 --branch "$BRIDGE_REF" ssh://git@thinkcentre.home:2200/gogdl/gogdl_flutter.git .ci/downstream/gogdl_flutter
    - |
      for manifest in .ci/downstream/lumen-cli/Cargo.toml .ci/downstream/gogdl_flutter/rust/Cargo.toml; do
        printf '\n[patch."ssh://git@thinkcentre.home:2200/gogdl/gogdl-lib.git"]\ngogdl-lib = { path = "%s" }\n' "$CI_PROJECT_DIR" >> "$manifest"
      done
    # The consumers' Cargo.lock still pins the old tag, and cargo ignores a [patch] until the lock
    # is updated ("patch ... was not used in the crate graph"), so re-lock gogdl-lib first.
    - cd .ci/downstream/lumen-cli && cargo update -p gogdl-lib && cargo build
    - cd "$CI_PROJECT_DIR/.ci/downstream/gogdl_flutter/rust" && cargo update -p gogdl-lib && cargo test
