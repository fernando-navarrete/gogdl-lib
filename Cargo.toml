[package]
name = "gogdl-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
url = "2.5.8"
flate2 = { version="1.1.9", default-features = false, features = ["zlib-rs"]}
serde_json = "1.0.150"
dashmap = "6.2.1"
futures = "0.3.32"
md-5 = "0.11.0"
sha2 = "0.11.0"
hex = "0.4.3"
filetime = "0.2"
uuid = { version = "1", features = ["v4"] }
tar = "0.4.44"

[dev-dependencies]
# Adds virtual-time control (`tokio::time::pause`/`advance`) on top of the
# main `tokio` dependency's "full" features, so the adaptive-controller
# tests can drive its internal timers deterministically instead of racing
# real wall-clock sleeps.
tokio = { version = "1.52.3", features = ["test-util"] }
