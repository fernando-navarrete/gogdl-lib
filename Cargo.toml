[package]
name = "gogdl-lib"
version = "0.1.1"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
url = "2.5.8"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
async-compression = { version = "0.4", features = ["tokio", "zlib"] }
serde_json = "1.0.150"
dashmap = "6.2.1"
md-5 = "0.11.0"
hex = "0.4.3"
futures-util = "0.3.34"
bytes = "1.12.0"
sysinfo = "0.39.6"
rand = "0.10.2"
tar = "0.4.44"
tokio-util = { version = "0.7.19", features = ["io-util"] }
